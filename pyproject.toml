[project]
name = "gwsus"
version = "0.0.1a0"
requires-python = ">=3.11"

dependencies = [
	"bigtree",
	"matplotlib",
	"mpmath",
	"numpy",
	"symengine",
	"sympy",
	"tabulate",
	"termcolor",
	"vpython",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
]

[build-system]
requires = ["setuptools<82", "wheel"]
build-backend = "setuptools.build_meta"
